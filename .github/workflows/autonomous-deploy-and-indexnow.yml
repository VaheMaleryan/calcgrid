name: Verify PayoutFolio
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify all 32 tools, private boundaries, and marketing math
        run: python3 engine/autopilot.py --ci
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
# Cloudflare Pages owns production deployment through its Git integration.
# Build command: python3 engine/autopilot.py --ci
# Output: dist    Production branch: main    Framework: None
# No Pages artifacts or private media are uploaded to GitHub Actions.
